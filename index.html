<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Nyann YT Music</title>
  <style>
    :root {
      --bg:#0a0c10; --card:#141820; --line:#243041; --text:#eef2f8;
      --muted:#8b9bb0; --accent:#ff4d4d; --accent2:#7c5cff;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;color:var(--text);
      background:radial-gradient(900px 480px at 80% -10%,#3a1520 0%,var(--bg) 55%);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    }
    .wrap{max-width:820px;margin:0 auto;padding:18px 14px 40px}
    h1{font-size:22px}
    .sub{color:var(--muted);font-size:13px;margin:6px 0 16px}
    
    /* --- CUSTOM PLAYER BOX --- */
    .player-box{
      background:#000;border:1px solid var(--line);border-radius:16px;
      overflow:hidden;margin-bottom:16px;aspect-ratio:16/9;position:relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    /* Ẩn iframe YouTube đi nhưng vẫn giữ âm thanh */
    #yt-player {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }
    .placeholder{
      position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);
      text-align:center;padding:20px;font-size:14px;z-index: 2;
    }
    
    /* Giao diện điều khiển tự chế */
    .custom-player {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      padding: 20px;
      display: none; /* Ẩn cho đến khi có nhạc */
    }
    .custom-player.active {
      display: flex;
    }
    .track-info {
      text-align: center;
      max-width: 90%;
    }
    .track-title {
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-artist {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .btn {
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--text);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: 0.2s;
      font-size: 18px;
    }
    .btn:hover {
      background: #1c2430;
      border-color: #3a4a60;
      transform: scale(1.05);
    }
    .btn.play-btn {
      background: var(--accent);
      border-color: var(--accent);
      width: 56px;
      height: 56px;
      font-size: 22px;
      color: white;
    }
    .btn.play-btn:hover {
      background: #ff3333;
    }
    .volume-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 16px;
    }
    /* Thanh âm lượng */
    input[type="range"] {
      -webkit-appearance: none;
      width: 100px;
      height: 4px;
      background: var(--line);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
      transition: 0.1s;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* --- DANH SÁCH BÀI HÁT --- */
    .now{font-size:14px;margin-bottom:14px}
    .now b{color:#fff}
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
      gap:12px;
    }
    .card{
      background:var(--card);border:1px solid var(--line);border-radius:14px;
      overflow:hidden;cursor:pointer;transition:.15s ease;
    }
    .card:hover{transform:translateY(-2px);border-color:#3a4a60}
    .card.active{border-color:var(--accent);box-shadow:0 0 0 1px rgba(255,77,77,.4)}
    .cover{
      width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#111;
    }
    .info{padding:10px}
    .title{font-size:13px;font-weight:600;line-height:1.35;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .artist{font-size:11px;color:var(--muted);margin-top:4px}
    .hint{margin-top:18px;font-size:12px;color:var(--muted);line-height:1.5}
    code{background:#1c2430;padding:1px 6px;border-radius:6px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Nyann YT Music</h1>
    <div class="sub">Playlist trong file · ảnh bìa YouTube · lên GitHub là chạy</div>

    <!-- KHU VỰC PLAYER -->
    <div class="player-box">
      <!-- Thẻ div ẩn để chứa iframe YouTube -->
      <div id="yt-player"></div>
      
      <!-- Placeholder khi chưa chọn bài -->
      <div class="placeholder" id="placeholder">Chọn một bài bên dưới để phát</div>
      
      <!-- Giao diện điều khiển tự chế -->
      <div class="custom-player" id="customPlayer">
        <div class="track-info">
          <div class="track-title" id="playingTitle">—</div>
          <div class="track-artist" id="playingArtist"></div>
        </div>
        <div class="controls">
          <button class="btn" id="stopBtn" title="Dừng">⏹</button>
          <button class="btn play-btn" id="playBtn" title="Phát / Tạm dừng">▶</button>
          <div class="volume-wrap">
            <span>🔊</span>
            <input type="range" id="volumeSlider" min="0" max="100" value="80" />
          </div>
        </div>
      </div>
    </div>

    <div class="now">Đang phát: <b id="now">—</b></div>

    <div class="grid" id="grid"></div>

    <div class="hint">
      Sửa playlist trong file: mảng <code>SONGS</code> bên dưới.<br/>
      Dán link YT hoặc chỉ cần <code>id</code> video (11 ký tự).
    </div>
  </div>

  <!-- Nhúng API của YouTube -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    /* =========================================================
       PLAYLIST
       ========================================================= */
    var SONGS = [
      {
        title: "Heroes Tonight",
        artist: "Janji",
        url: "https://www.youtube.com/watch?v=3nQNiWdeH2Q"
      },
      {
        title: "Energy",
        artist: "Elektronomia",
        url: "https://www.youtube.com/watch?v=s3XXvtQfp1c"
      },
      {
        title: "Make Me Move",
        artist: "Culture Code",
        url: "https://www.youtube.com/watch?v=fyzSr3L0oZM"
      },
      {
        title: "Somewhere Only We Know",
        artist: "Keane",
        url: "https://www.youtube.com/watch?v=Oextk-If8HQ"
      },
      {
        title: "Gang Unit",
        artist: "Lil Loaded",
        url: "https://m.youtube.com/watch?v=DBhfYWOWR_k"
      },
      {
        title: "To The Max",
        artist: "Lil Loaded",
        url: "https://m.youtube.com/watch?v=4Mv--f1yfq8"
      },
      {
        title: "6Locc 6a6y (Remix)",
        artist: "Lil Loaded",
        url: "https://m.youtube.com/watch?v=aITIKxjFaL0"
      }
    ];

    function extractId(urlOrId) {
      if (!urlOrId) return null;
      var s = String(urlOrId).trim();
      var m;
      m = s.match(/[?&]v=([a-zA-Z0-9_-]{6,})/);
      if (m) return m[1];
      m = s.match(/youtu\.be\/([a-zA-Z0-9_-]{6,})/);
      if (m) return m[1];
      m = s.match(/youtube\.com\/shorts\/([a-zA-Z0-9_-]{6,})/);
      if (m) return m[1];
      m = s.match(/youtube\.com\/embed\/([a-zA-Z0-9_-]{6,})/);
      if (m) return m[1];
      if (/^[a-zA-Z0-9_-]{11}$/.test(s)) return s;
      return null;
    }

    function coverUrl(id) {
      return "https://img.youtube.com/vi/" + id + "/hqdefault.jpg";
    }

    var current = -1;
    var player;
    var grid = document.getElementById("grid");
    var placeholder = document.getElementById("placeholder");
    var customPlayer = document.getElementById("customPlayer");
    var nowEl = document.getElementById("now");
    var playBtn = document.getElementById("playBtn");
    var stopBtn = document.getElementById("stopBtn");
    var volumeSlider = document.getElementById("volumeSlider");
    var playingTitle = document.getElementById("playingTitle");
    var playingArtist = document.getElementById("playingArtist");

    // Chuẩn hóa playlist
    var list = [];
    for (var i = 0; i < SONGS.length; i++) {
      var s = SONGS[i] || {};
      var id = extractId(s.url || s.id || s.link);
      if (!id) continue;
      list.push({
        id: id,
        title: s.title || ("YouTube " + id),
        artist: s.artist || ""
      });
    }

    // --- XỬ LÝ YOUTUBE API ---
    // Hàm này sẽ được gọi tự động khi API tải xong
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-player', {
        height: '100%',
        width: '100%',
        videoId: '', // Ban đầu để trống
        playerVars: {
          'playsinline': 1,
          'controls': 0,      // Ẩn điều khiển gốc của YT
          'disablekb': 1,
          'fs': 0,            // Ẩn nút fullscreen
          'modestbranding': 1 // Giảm logo YT
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady(event) {
      player.setVolume(volumeSlider.value);
    }

    function onPlayerStateChange(event) {
      // 0 = ended, 1 = playing, 2 = paused, 3 = buffering, 5 = cued
      if (event.data == YT.PlayerState.PLAYING) {
        playBtn.innerHTML = '⏸'; // Đổi thành nút Pause
      } else if (event.data == YT.PlayerState.PAUSED) {
        playBtn.innerHTML = '▶'; // Đổi thành nút Play
      } else if (event.data == YT.PlayerState.ENDED) {
        playBtn.innerHTML = '▶';
        // Tự động chuyển bài tiếp theo
        if (current < list.length - 1) {
          playAt(current + 1);
        } else {
          stopBtn.click(); // Hết playlist thì dừng
        }
      }
    }

    // --- CÁC NÚT ĐIỀU KHIỂN ---
    playBtn.onclick = function() {
      if (!player) return;
      var state = player.getPlayerState();
      if (state == YT.PlayerState.PLAYING) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    };

    stopBtn.onclick = function() {
      if (!player) return;
      player.stopVideo();
      customPlayer.classList.remove('active');
      placeholder.style.display = 'grid';
      nowEl.textContent = '—';
      current = -1;
      render();
    };

    volumeSlider.oninput = function(e) {
      if (player && player.setVolume) {
        player.setVolume(e.target.value);
      }
    };

    // --- HÀM PHÁT NHẠC ---
    function playAt(index) {
      if (index < 0 || index >= list.length) return;
      current = index;
      var song = list[index];
      
      // Cập nhật giao diện
      placeholder.style.display = 'none';
      customPlayer.classList.add('active');
      playingTitle.textContent = song.title;
      playingArtist.textContent = song.artist || "Không rõ";
      nowEl.textContent = song.title + (song.artist ? " — " + song.artist : "");
      playBtn.innerHTML = '⏸'; // Hiển thị tạm nút Pause vì đang tải
      
      // Gọi API để phát nhạc
      if (player && player.loadVideoById) {
        player.loadVideoById(song.id);
      }
      render();
    }

    function render() {
      grid.innerHTML = "";
      list.forEach(function (song, i) {
        var card = document.createElement("div");
        card.className = "card" + (i === current ? " active" : "");
        card.innerHTML =
          '<img class="cover" alt="" loading="lazy" />' +
          '<div class="info"><div class="title"></div><div class="artist"></div></div>';
        var img = card.querySelector(".cover");
        img.src = coverUrl(song.id);
        img.onerror = function () {
          img.src = "https://img.youtube.com/vi/" + song.id + "/mqdefault.jpg";
        };
        card.querySelector(".title").textContent = song.title;
        card.querySelector(".artist").textContent = song.artist || song.id;
        card.onclick = function () { playAt(i); };
        grid.appendChild(card);
      });
    }

    render();
    if (!list.length) {
      placeholder.textContent = "Playlist trống — thêm link vào mảng SONGS.";
    }
  </script>
</body>
  </html>
